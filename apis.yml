apis:
- aid: us-dot:faa-aeronautic-product-release-api
  name: FAA Aeronautic Product Release API (APRA)
  description: >-
    FAA aeronautical chart and data publication download API. Thirty-four GET operations expose edition
    metadata and ZIP product downloads for the digital Terminal Procedures Publication (dTPP), IFR enroute
    and oceanic charts, VFR charts, the Coded Instrument Flight Procedures data set, the NFDC/NASR 28-day
    airspace subscription, the Digital Obstacle File and more. Verified anonymously with HTTP 200 on 2026-07-28
    against /apra/nfdc/nasr/info and /apra/dtpp/info — no API key required. Two operations (getDERSRelease,
    getDERSEdition) are marked deprecated in the spec.
  humanURL: https://api.faa.gov/s/
  baseURL: https://external-api.faa.gov/apra
  tags:
  - Aviation
  - Charts
  - Aeronautical Data
  - Airspace
  - FAA
