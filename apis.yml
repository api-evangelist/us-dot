name: U.S. Department of Transportation
kind: company
description: >-
  The U.S. Department of Transportation (DOT) is the federal transportation regulator for
  the United States, the deepest travel market in the world. In aviation DOT is not a
  participant in the distribution chain — it is the counterweight to it: through the Office
  of the Secretary it writes and enforces 14 CFR Part 256 on electronic airline information
  systems (explicitly naming global distribution systems, corporate booking tools and
  internet flight search tools), Part 257 on code-share disclosure, Part 250 on oversales,
  Part 259 on enhanced passenger protections, Part 260 on fare and ancillary fee refunds,
  and 399.84 on full-fare advertising. Its Bureau of Transportation Statistics is the sole
  authoritative source for US airline economics — T-100 segment traffic, Form 41 financials,
  the Consumer Airfare Report city-pair fare tables, denied boardings and mishandled baggage
  — published as free Socrata SODA APIs. Its Federal Aviation Administration operates a
  Gravitee API portal at api.faa.gov whose public catalog is enumerable without login and
  serves genuinely open, unauthenticated OpenAPI 3.0.1 services for national airspace delay
  status and aeronautical chart product releases, alongside gated APIs for pilot records and
  safety reporting. API posture, honestly: transportation.gov itself is bot-blocked (HTTP 403
  to any non-browser client) and publishes no departmental OpenAPI, but the data surfaces
  underneath it are open, unmetered, public domain, and fully bulk-exportable — this is a
  provider with an excellent exit path and no commercial lock-in of any kind.
