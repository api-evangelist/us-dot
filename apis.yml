- aid: us-dot:faa-safety-assurance-system-api
  name: FAA Safety Assurance System (SAS) API
  description: >-
    Single-operation submission API for passenger discrepancy reporting into the FAA Safety Assurance
    System. Air carriers submit hazardous-material discrepancies discovered on passengers or in passenger
    baggage. The harvested OpenAPI 3.0.0 declares apiKey and appId security schemes (X-API-KEY plus X-APP-ID),
    so a credential is required; the definition itself is published openly in the FAA portal catalog.
    The request body carries passenger PII and a PNR locator and is the most sensitive payload in the
    DOT surface area.
  humanURL: https://api.faa.gov/s/
  baseURL: https://external.apic4e.faa.gov/axh-sasp-api/sas
  tags:
  - Aviation
  - Safety
  - Compliance
  - FAA
  properties:
  - type: OpenAPI
    url: openapi/us-dot-faa-safety-assurance-system-api-openapi.yml
