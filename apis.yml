apis:
- aid: us-dot:faa-airport-status-web-service
  name: FAA Airport Status Web Service (ASWS)
  description: >-
    Real-time National Airspace System delay and airport status service operated by the
    Federal Aviation Administration, a DOT operating administration. Two GET operations
    return current ground delays, ground stops, arrival/departure delays and closures across
    supported US airports, and per-airport status keyed by IATA or ICAO code. Verified
    anonymously with HTTP 200 on 2026-07-28 — no API key, no registration, no terms
    acceptance. Responses carry both IATA (JFK) and ICAO (KJFK) identifiers.
  humanURL: https://api.faa.gov/s/
  baseURL: https://external-api.faa.gov/asws/api
  tags:
  - Aviation
  - Airports
  - Delays
  - Air Traffic
  - FAA
  properties:
  - type: OpenAPI
    url: openapi/us-dot-faa-airport-status-web-service-openapi.yml
  - type: Documentation
    url: https://api.faa.gov/s/
- aid: us-dot:faa-aeronautic-product-release-api
  name: FAA Aeronautic Product Release API (APRA)
  description: >-
    FAA aeronautical chart and data publication download API. Thirty-four GET operations
    expose edition metadata and ZIP product downloads for the digital Terminal Procedures
    Publication (dTPP), IFR enroute and oceanic charts, VFR charts, the Coded Instrument
    Flight Procedures data set, the NFDC/NASR 28-day airspace subscription, the Digital
    Obstacle File and more. Verified anonymously with HTTP 200 on 2026-07-28 against
    /apra/nfdc/nasr/info and /apra/dtpp/info — no API key required.
  humanURL: https://api.faa.gov/s/
  baseURL: https://external-api.faa.gov/apra
  tags:
  - Aviation
  - Charts
  - Aeronautical Data
  - Airspace
  - FAA
  properties:
  - type: OpenAPI
    url: openapi/us-dot-faa-aeronautic-product-release-api-openapi.yml
  - type: Documentation
    url: https://www.faa.gov/air_traffic/flight_info/aeronav/digital_products/
- aid: us-dot:faa-air-carrier-prd-api
  name: FAA Air Carrier Pilot Records Database (PRD) API
  description: >-
    Data submission API for the FAA Pilot Records Database. Five paths covering pilot record
    create/update/delete, pilot data tracking, and asynchronous pilot data search request and
    response. Access is restricted by the FAA to operators under 14 CFR Part 121, 135, 125,
    91K, Air Tour, Public Aircraft, or Part 91 Corporate — this is an accreditation-style gate,
    not a self-serve signup. The OpenAPI 3.0.0 definition is published openly in the FAA
    portal catalog and was harvested verbatim.
  humanURL: https://api.faa.gov/s/
  baseURL: https://external.apic4e.faa.gov
  tags:
  - Aviation
  - Pilot Records
  - Airlines
  - Compliance
  - FAA
  properties:
  - type: OpenAPI
    url: openapi/us-dot-faa-air-carrier-prd-api-openapi.yml
  - type: Documentation
    url: https://api.faa.gov/s/
- aid: us-dot:faa-safety-assurance-system-api
  name: FAA Safety Assurance System (SAS) API
  description: >-
    Single-operation submission API for passenger discrepancy reporting into the FAA Safety
    Assurance System. The harvested OpenAPI 3.0.0 declares apiKey and appId security schemes,
    so a credential is required; the definition itself is published openly in the FAA portal
    catalog.
  humanURL: https://api.faa.gov/s/
  baseURL: https://external.apic4e.faa.gov/axh-sasp-api/sas
  tags:
  - Aviation
  - Safety
  - Compliance
  - FAA
  properties:
  - type: OpenAPI
    url: openapi/us-dot-faa-safety-assurance-system-api-openapi.yml
  - type: Documentation
    url: https://api.faa.gov/s/
- aid: us-dot:dot-data-hub-soda-api
  name: DOT Data Hub Open Data API
  description: >-
    The departmental open data platform, served from both data.transportation.gov and
    datahub.transportation.gov on Socrata SODA 2.1. For travel and aviation this is where the
    DOT Office of the Assistant Secretary for Aviation and International Affairs publishes the
    Consumer Airfare Report city-pair fare tables (Tables 1, 1a, 2, 5, 6 and 7), the Airline
    Quarterly Financial Review, and international seat and passenger reports. Datasets are
    licensed Public Domain U.S. Government (USGOV_WORKS). Verified anonymously with HTTP 200
    on 2026-07-28 against /resource/4f3n-jbg2.json and /resource/tfrh-tu9e.json — no app token
    required for the volumes tested.
  humanURL: https://data.transportation.gov/
  baseURL: https://datahub.transportation.gov/resource
  tags:
  - Open Data
  - Aviation
  - Airfares
  - Airlines
  - Statistics
  properties:
  - type: Documentation
    url: https://dev.socrata.com/docs/endpoints.html
  - type: Portal
    url: https://data.transportation.gov/
  - type: Portal
    url: https://datahub.transportation.gov/
  - type: License
    url: https://www.usa.gov/government-works
- aid: us-dot:bts-open-data-soda-api
  name: Bureau of Transportation Statistics Open Data API
  description: >-
    The Bureau of Transportation Statistics open data platform on Socrata SODA 2.1, and the
    authoritative record of US commercial aviation activity. Aviation holdings verified live
    include T-100 segment summaries by carrier, country, origin airport and month; Air Carrier
    Financial (Form 41) fuel, revenue, employee and fleet-age series; average air fare by
    carrier and by quarter; commercial aviation mishandled baggage and mishandled wheelchairs
    and scooters; and involuntary denied boardings by airline. Verified anonymously with HTTP
    200 on 2026-07-28 against /resource/bu82-4pwz.json, /resource/6u8d-47ih.json and
    /resource/xyfb-hgtv.json.
  humanURL: https://data.bts.gov/
  baseURL: https://data.bts.gov/resource
