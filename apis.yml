- aid: us-dot:its-jpo-ode-rest-api
  name: USDOT ITS JPO Operational Data Environment (ODE) REST API
  description: >-
    The reference connected-vehicle data platform authored by the USDOT Intelligent Transportation Systems
    Joint Program Office. Eight operations over SAE J2735 messaging — Traveler Information Message query,
    create, update and delete against physical roadside units, Probe Data Management deposit, SNMP query
    and on-board-unit log upload. This is DEPLOYABLE SOFTWARE, not a DOT-hosted service: the Swagger 2.0
    host is the literal placeholder "yourhostname" and an operator runs it on its own infrastructure under
    Apache 2.0. The REST API is the thin edge of a Kafka platform whose 35 topics are declared in the
    ODE's own configuration and captured as an AsyncAPI 3.0 document here. Safety-critical — the TIM writes
    change what roadside units broadcast to vehicles, and there is no idempotency key anywhere on the
    surface.
  humanURL: https://github.com/usdot-jpo-ode/jpo-ode
  baseURL: https://github.com/usdot-jpo-ode/jpo-ode
  tags:
  - Connected Vehicles
  - ITS
  - Roadside Units
  - SAE J2735
  - Safety
  - Kafka
