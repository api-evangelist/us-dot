- aid: us-dot:faa-air-carrier-prd-api
  name: FAA Air Carrier Pilot Records Database (PRD) API
  description: >-
    Data submission API for the FAA Pilot Records Database. Five paths covering pilot record create/update/delete,
    pilot data tracking, and asynchronous pilot data search request and response. Access is restricted
    by the FAA to operators under 14 CFR Part 121, 135, 125, 91K, Air Tour, Public Aircraft, or Part 91
    Corporate — this is an accreditation-style gate, not a self-serve signup. Credentials are client_id
    and client_secret request headers declared as ordinary parameters, not as securitySchemes. The OpenAPI
    3.0.0 definition is published openly in the FAA portal catalog and was harvested verbatim.
  humanURL: https://api.faa.gov/s/
  baseURL: https://external.apic4e.faa.gov
  tags:
  - Aviation
  - Pilot Records
  - Airlines
  - Compliance
  - FAA
  properties:
