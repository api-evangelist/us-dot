- aid: us-dot:nhtsa-vpic-api
  name: NHTSA vPIC (Vehicle Product Information Catalog) API
  description: >-
    The National Highway Traffic Safety Administration's Vehicle Product Information Catalog and VIN decoder,
    and the most widely consumed API in the department. Decodes any US-market VIN into make, model, model
    year, body class, engine, plant and safety-equipment fields, and enumerates the full manufacturer,
    make, model and vehicle-type reference data behind it. Verified anonymously with HTTP 200 on 2026-07-28
    — DecodeVinValues returned a decoded 2011 BMW VIN and getallmakes returned 12,306 makes. No API key,
    no registration, no rate charge. Responses support format=json or format=xml. NHTSA publishes no OpenAPI
    for it; the reference is HTML at vpic.nhtsa.dot.gov/api/.
  humanURL: https://vpic.nhtsa.dot.gov/api/
  baseURL: https://vpic.nhtsa.dot.gov/api/vehicles
  tags:
  - Automotive
  - Vehicles
  - VIN
  - Safety
  - NHTSA
  - Open Data
  properties:
  - type: Documentation
    url: https://vpic.nhtsa.dot.gov/api/
  - type: APIReference
    url: https://vpic.nhtsa.dot.gov/api/
- aid: us-dot:nhtsa-safety-api
  name: NHTSA Safety API (recalls, complaints, safety ratings)
  description: >-
    The NHTSA public safety API that powers the dynamic search applications on nhtsa.gov. Three families:
    /recalls for safety recalls by vehicle or campaign number, /complaints for consumer complaints filed
    with NHTSA (each with ODI number, crash and fire flags, injury and death counts and incident dates),
    and /SafetyRatings for the New Car Assessment Program 5-Star Safety Ratings walked by model year,
    make and model. Verified anonymously with HTTP 200 on 2026-07-28 — complaintsByVehicle for a 2020
    Honda Accord returned 341 records and /SafetyRatings returned 37 model years. No API key. Governed
    by the NHTSA API Use Policy published at the base host.
  humanURL: https://www.nhtsa.gov/nhtsa-datasets-and-apis
  baseURL: https://api.nhtsa.gov
  tags:
  - Automotive
  - Recalls
  - Safety
  - Consumer Protection
  - NHTSA
  - Open Data
  properties:
  - type: Documentation
    url: https://www.nhtsa.gov/nhtsa-datasets-and-apis
  - type: TermsOfService
    url: https://api.nhtsa.gov/
- aid: us-dot:fra-safety-data-api
  name: FRA Safety Data Web Services
  description: >-
    The Federal Railroad Administration's rail safety web services, and the only SOAP surface in the department.
    Two WSDL 1.1 contracts were retrieved live and harvested verbatim on 2026-07-28. The Master Web Service
    (DatadownloadService.asmx, 30 operations) exposes the Rail Equipment Accident/Incident Report (Form
    54), the Highway-Rail Grade Crossing Accident/Incident Report (Form 57), Form 55 and 55a, grade crossing
    inventory, defect and PHMSA defect data, hazmat shipper data and railroad reference data, each retrievable
    by railroad or by state, plus per-form schema operations. The Lite API (LiteApiService.asmx, 5 operations)
    returns casualty, enforcement, summary, ten-year and train accident series by year. Declared a pilot
    by FRA. Accounts are requested by email to RsisSupport@dot.gov — the Master service and the Lite API
    require separate requests.
  humanURL: https://safetydata.fra.dot.gov/MasterWebService/FRASafetyDataAPIs.aspx
  baseURL: https://safetydata.fra.dot.gov/MasterWebService
  tags:
  - Rail
