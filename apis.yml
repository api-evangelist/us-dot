- aid: us-dot:dot-data-hub-soda-api
  name: DOT Data Hub Open Data API
  description: >-
    The departmental open data platform, served from both data.transportation.gov and datahub.transportation.gov
    on Socrata SODA 2.1. For travel and aviation this is where the DOT Office of the Assistant Secretary
    for Aviation and International Affairs publishes the Consumer Airfare Report city-pair fare tables
    (Tables 1, 1a, 2, 5, 6 and 7), the Airline Quarterly Financial Review, and international seat and
    passenger reports. 1,542 datasets enumerated in the DCAT-US 1.1 document at /data.json. Datasets are
    licensed Public Domain U.S. Government (USGOV_WORKS). Verified anonymously with HTTP 200 on 2026-07-28
    against /resource/4f3n-jbg2.json and /resource/tfrh-tu9e.json — no app token required for the volumes
    tested.
  humanURL: https://data.transportation.gov/
  baseURL: https://datahub.transportation.gov/resource
