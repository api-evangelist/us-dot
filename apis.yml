- aid: us-dot:faa-data-catalog-ckan-api
  name: FAA Data Catalog (CKAN Action API v3)
  description: >-
    The Federal Aviation Administration's open data catalog, running CKAN 2.11.4 and exposing the full
    CKAN Action API v3 anonymously at /api/3/action/. package_list, package_search, package_show, organization_list
    and status_show all answer without a credential; verified 2026-07-28. The catalog also publishes a
    Project Open Data / DCAT-US 1.1 document at /data.json, harvested to well-known/us-dot-faa-catalog-data.json.
    Small — six datasets — but it is the only CKAN surface in the department and the only one with a documented,
    self-describing action API (help_show returns the parameter contract per action).
  humanURL: https://catalog.data.faa.gov/
