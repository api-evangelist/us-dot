- aid: us-dot:bts-open-data-soda-api
  name: Bureau of Transportation Statistics Open Data API
  description: >-
    The Bureau of Transportation Statistics open data platform on Socrata SODA 2.1, and the authoritative
    record of US commercial aviation activity. Aviation holdings verified live include T-100 segment summaries
    by carrier, country, origin airport and month; Air Carrier Financial (Form 41) fuel, revenue, employee
    and fleet-age series; average air fare by carrier and by quarter; commercial aviation mishandled baggage
    and mishandled wheelchairs and scooters; and involuntary denied boardings by airline. 420 datasets
    enumerated in the DCAT-US 1.1 document at /data.json. Verified anonymously with HTTP 200 on 2026-07-28
    against /resource/bu82-4pwz.json, /resource/6u8d-47ih.json and /resource/xyfb-hgtv.json.
  humanURL: https://data.bts.gov/
  baseURL: https://data.bts.gov/resource
