switchingCost:
  interfaceShape:
    value: standard-plus-proprietary
    standardsNamed:
    - OpenAPI 3.0.1 (FAA Airport Status Web Service v1.2.1, Aeronautic Product Release API v1.4.0)
    - OpenAPI 3.0.0 (FAA Safety Assurance System API, PRD Air Carrier API)
    - Socrata SODA 2.1 (data.transportation.gov, datahub.transportation.gov, data.bts.gov)
    - Socrata Discovery API v1 (api.us.socrata.com catalog, used to enumerate holdings)
    - 14 CFR Chapter II (the regulatory contract DOT imposes on the distribution chain)
    evidence: >-
      Every machine contract DOT and FAA publish is described in an open description format
      and served over plain HTTP with no vendor SDK requirement. Four OpenAPI 3.0.x documents
      were harvested verbatim from the FAA portal and all parse. The SODA query dialect is
      publicly documented at dev.socrata.com and is implemented by hundreds of other
      government tenants, so query code written against DOT moves to any other Socrata host
      unchanged.
    proprietaryElements: >-
      The payload vocabularies are DOT and FAA specific. Nothing here conforms to OpenTravel /
      OTA, HTNG, IATA NDC, or any travel-industry schema. APRA returns FAA ARPA-namespaced XML
      (http://arpa.ait.faa.gov/arpa_response) and delivers chart products as opaque ZIPs. ASWS
      returns an FAA-shaped delay object. BTS field names (mkt_carrier, citymarketid_1,
      airportid_1) are BTS conventions. So the transport and description are standard; the
      semantics are not, and a consumer swapping to a commercial flight-data vendor would
      rewrite the mapping layer even though the protocol stays the same.
  secondSource:
    value: no-alternative
    alternativesConsidered:
    - >-
      Commercial flight-status and delay vendors — FlightAware, Cirium/FlightStats, OAG,
      aviationstack, Aviation Edge, AviationAPI. These are delivery alternatives, not source
      alternatives: several of them resell or derive from the same FAA ASWS/NASR feeds. Moving
      to one buys better SLAs and richer coverage but does not remove the FAA as origin.
    - >-
      Aeronautical charting — Jeppesen (Boeing) sells an alternative chart product, but the
      FAA-published dTPP, enroute and CIFP products in APRA are the free US regulatory source
      of record and Jeppesen is a paid, differently-shaped substitute, not a drop-in.
    - >-
      Airline economics — there is no second source for T-100, Form 41 or DB1B. Every
      commercial airline-data product in the US market (Cirium, OAG, Diio, Airline Data Inc.)
      is a repackaging of BTS filings. A customer can pay a vendor for a nicer interface but
      the underlying monopoly is statutory.
    - >-
      Aircraft registration — the FAA registry is the only US registry. No alternative exists.
    verdict: >-
      no-alternative is the honest finding. DOT is the origin of record for US aviation data
      by statute. What makes this benign rather than coercive is that the origin charges
      nothing, gates nothing on the public surface, and licenses everything into the public
      domain.
  exitPath:
    value: bulk-export-documented
    operationsCited:
    - >-
      Socrata SODA bulk export — every dataset supports full extraction via
      /resource/{id}.{json,csv,xml,tsv} with $limit and $offset paging, and
      /api/views/{id}/rows.csv?accessType=DOWNLOAD for a whole-table dump. Verified against
      data.bts.gov and datahub.transportation.gov.
    - >-
      TranStats (https://www.transtats.bts.gov/, HTTP 200) — form-driven full-table ZIP
      downloads of T-100, DB1B and On-Time Performance, the canonical bulk route for BTS
      aviation data.
    - >-
      FAA releasable aircraft registry — https://registry.faa.gov/database/ReleasableAircraft.zip
      returned HTTP 200 with a ZIP payload, anonymously.
    - >-
      FAA APRA — every /info operation returns edition metadata and every /chart operation
      returns the complete product ZIP for that edition, so the entire US aeronautical chart
      corpus is bulk-retrievable through the documented API.
    verdict: >-
      Best-in-class. There is nothing a consumer holds inside DOT that they cannot take out,
      because DOT holds nothing of theirs. Data flows one way and the whole corpus is
      downloadable.
  identifierPortability:
    summary: >-
      Global industry identifiers plus openly published DOT-assigned numeric keys — nothing
      opaque or vendor-private.
    identifiersFound:
    - IATA two-letter carrier codes (NK Spirit, UA United) in BTS and DOT datasets
    - IATA three-letter airport codes (JFK, SFO, PHL, BOS) in ASWS and BTS
    - ICAO four-letter airport codes (KJFK) returned by ASWS alongside IATA
    - DOT/BTS Airline ID (airline_id 20416 = Spirit; mkt_carrier_airline_id 19977 = United)
    - BTS City Market ID (citymarketid_1 32467 Miami, 31703 New York) and Airport ID (airportid_1 10257)
    - FAA N-number aircraft registration marks and registry serials (ReleasableAircraft)
    - FAA facility/NASR location identifiers in the NFDC subscription
    - US DOT Number and MC Docket Number for motor carriers (FMCSA surface, outside aviation)
    notFound:
    - No PNR record locators — DOT does not touch reservations
    - No IATA/ARC agency numbers in any public API surface
    - No GDS record IDs, hotel chain codes or GIATA IDs
    assessment: >-
      Because DOT keys its aviation data on IATA/ICAO codes and publishes its own numeric IDs
      with open lookup tables, joins built against DOT data survive a move to any commercial
      vendor. This is the opposite of the GDS pattern, where the record locator is the
      hostage.
  contractualLockIn:
    published: true
    verbatim:
    - >-
      Dataset license (from https://datahub.transportation.gov/api/views/4f3n-jbg2.json):
      "license": {"name": "Public Domain U.S. Government", "termsLink":
      "https://www.usa.gov/government-works"}, "licenseId": "USGOV_WORKS"
    - >-
      FAA Air Carrier PRD API access restriction (from the FAA portal catalog description):
      "Access is restricted to operators under Part 121, 135, 125, 91K, Air Tour, Public
      Aircraft, or 91 Corporate."
    findings: >-
      No minimum term, no exclusivity, no full-content agreement, no segment fee, no
      termination notice and no revocation-on-account-closure clause is published for any DOT
      or FAA public API, because the public APIs require no account. The only contractual
      surface is the regulatory one, and it runs from DOT outward to industry rather than from
      DOT inward to developers.
    regulatoryLockInImposedOnIndustry:
    - >-
      14 CFR Part 256, Electronic Airline Information Systems (Docket DOT-OST-2014-0056, 81 FR
      76828, Nov. 3, 2016). Section 256.1(a) verbatim: "The purpose of this part is to set
      forth requirements for the display of flight options by electronic airline information
      systems that provide air carrier or foreign air carrier schedule, fare, or availability
      information, including, but not limited to, global distribution systems (GDSs),
      corporate booking tools, and internet flight search tools, for use by consumers,
      carriers, ticket agents, and other business entities so as to prevent unfair or
      deceptive practices in the distribution and sale of air transportation." Section 256.4(b)
      verbatim: "An EAIS's integrated display must not give any carrier's flights a
      system-imposed preference over any other carrier's flights in that market based on
      carrier identity unless the preference is prominently disclosed as provided for in
      256.5." This is the single most important regulatory fact in this record — DOT directly
      regulates GDS display neutrality.
    - 14 CFR Part 250 — Oversales (denied boarding compensation)
    - 14 CFR Part 257 — Disclosure of Code-Sharing Arrangements and Long-Term Wet Leases
    - 14 CFR Part 258 — Disclosure of Change-of-Gauge Services
    - 14 CFR Part 259 — Enhanced Protections for Airline Passengers
    - 14 CFR Part 260 — Refunds for Airline Fare and Ancillary Service Fees
    - 14 CFR Part 399 (incl. 399.84 full-fare advertising) — Statements of General Policy
    - 14 CFR Part 271 — Guidelines for Subsidizing Air Carriers Providing Essential Air Transportation
    partListSource:
      url: https://www.ecfr.gov/api/versioner/v1/structure/2026-07-01/title-14.json
      status: 200
      fetched: '2026-07-28'
  distributionModel:
    value: not-applicable
    rationale: >-
      DOT sells no inventory and intermediates no booking. It sits outside the distribution
      chain as its regulator. The relevant posture is that DOT asserts jurisdiction over every
      electronic airline information system displayed to US consumers — GDSs, corporate
      booking tools and internet flight search tools alike — under Part 256, and over
      code-share and fee disclosure at every point of sale including ticket agents and OTAs.
  ndcPosture:
    value: not applicable — regulator, not a carrier
    detail: >-
      No IATA NDC reference of any kind was found in DOT or FAA published material or API
      surfaces. DOT publishes no NDC certification, no NDC endpoint and no NDC guidance. The
      closest US regulatory analogue to NDC's stated aim of restructuring GDS intermediation
      is 14 CFR Part 256's display-neutrality and disclosure obligations, which regulate the
      behaviour of the incumbent channel rather than replacing its message format.
  accessGate:
    value: self-serve
    whatADeveloperMustSign: >-
      Nothing. The FAA Airport Status Web Service, the FAA Aeronautic Product Release API, the
      FAA releasable aircraft registry download, and every Socrata dataset on
      data.transportation.gov, datahub.transportation.gov and data.bts.gov all answered HTTP
      200 anonymously on 2026-07-28 with no API key, no OAuth, no registration and no terms
      click-through. A Socrata app token is optional and only affects throttling tiers.
    gatedSubsets:
    - >-
      FAA NOTAM API (https://external-api.faa.gov/notamapi/v1/notams) — HTTP 401, credential
      required, not present in the public portal catalog. This is the one materially gated
      aviation surface.
    - >-
      FAA Safety Assurance System API — the harvested OpenAPI declares apiKey and appId
      security schemes.
    - >-
      FAA Air Carrier PRD API — accreditation-style gate, limited by regulation to Part 121,
      135, 125, 91K, Air Tour, Public Aircraft and Part 91 Corporate operators.
    - >-
      FAA SWIM (swim.faa.gov did not resolve from this network) — historically requires an
      account and a data use agreement; could not be verified in this pass and is therefore
      not listed in apis[].
  overallVerdict: >-
    The cost of leaving U.S. DOT is effectively zero and the cost of arriving is effectively
    zero, which makes this organization the structural inverse of the GDS and channel-manager
    incumbents that define the travel sector. What DOT does own is monopoly origination: it is
    the only source of US airline economic filings, US aircraft registration, US aeronautical
    charts and US airspace status. It converts that monopoly into a public good by licensing
    it USGOV_WORKS, serving it unauthenticated, and documenting bulk export. For a Kin Score
    switching-cost dimension, this record is the reference point at the free end of the scale
    — and the Part 256 material is the evidence that a regulator's real lock-in exposure is
    measured in what it imposes on others, not in what it charges its own developers.
