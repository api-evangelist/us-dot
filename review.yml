notes:
  duplicateWarning: >-
    The api-evangelist network already carries overlapping profiles at all/dot,
    all/department-of-transportation, all/bureau-of-transportation-statistics and
    all/federal-aviation-administration. This us-dot record was built independently from live
    probes and should be reconciled against those four under the duplicate-provider retirement
    process before publication.
  scopeNote: >-
    FAA is an operating administration of the U.S. Department of Transportation, so its API
    portal is recorded here as a DOT surface. NHTSA and FMCSA APIs exist under DOT as well but
    are out of scope for this travel and aviation seam and are already profiled elsewhere in
    the network.
