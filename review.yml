aid: us-dot
name: U.S. Department of Transportation
review:
  question: >-
    What would it cost a consumer of U.S. Department of Transportation travel and aviation
    data or APIs to leave, and what does DOT require of the airline distribution chain?
  answer: >-
    Almost nothing to leave, and a great deal of the industry. DOT publishes its aviation
    data as public-domain Socrata SODA APIs and its FAA airspace and charting services as
    unauthenticated OpenAPI 3.0.1 endpoints, with documented bulk export in every direction.
    There is no commercial agreement, no minimum term, no fee and no revocation risk. The
    lock-in that matters here runs the other way: DOT is the regulator whose 14 CFR Part 256
    governs display bias in global distribution systems, corporate booking tools and internet
    flight search tools, and whose Parts 250, 257, 258, 259, 260 and 399.84 set the consumer
    disclosure floor that airlines, ticket agents and OTAs must meet at every point of sale.
  date: '2026-07-28'
  reviewer: API Evangelist
  tier: regulator
  homeMarket: United States
findings:
  summary: >-
    U.S. DOT has no departmental developer portal reachable by automation — www.transportation.gov
    returns HTTP 403 (Akamai "Access Denied") to every non-browser client tested, including
    /developer, /data and /openapi.json. Underneath it, three genuinely open surfaces exist and
    were all verified live on 2026-07-28: the DOT Data Hub (data.transportation.gov and
    datahub.transportation.gov) and BTS Open Data (data.bts.gov) on Socrata SODA 2.1, and the
    FAA API portal at api.faa.gov (a Gravitee deployment redirecting to portal.apic4e.faa.gov)
    whose portal catalog API is enumerable anonymously and returned seven APIs, four of which
    carry published OpenAPI definitions. All four specs were harvested verbatim and parse.
  portals:
  - url: https://www.transportation.gov/
    status: 403
    note: Akamai bot block. Returns "Access Denied" HTML to curl and to WebFetch with a browser User-Agent.
  - url: https://www.transportation.gov/developer
    status: 403
    note: Same block. Could not confirm whether a departmental developer page exists behind it.
  - url: https://data.transportation.gov/
    status: 200
    note: DOT Data Hub, Socrata. Self-serve, no login required to query.
  - url: https://datahub.transportation.gov/
    status: 200
    note: Redirects to /login for the UI, but the SODA resource and catalog endpoints answer anonymously.
  - url: https://data.bts.gov/
    status: 200
    note: Bureau of Transportation Statistics open data, Socrata. Discovery API reports 597 datasets.
  - url: https://www.bts.gov/
    status: 403
    note: Akamai bot block, same as transportation.gov.
  - url: https://www.transtats.bts.gov/
    status: 200
    note: TranStats — the form-driven bulk download portal for T-100, DB1B and On-Time Performance.
  - url: https://api.faa.gov/
    status: 200
    note: 301 to https://portal.apic4e.faa.gov/ — Gravitee API portal, Angular SPA.
  - url: https://portal.apic4e.faa.gov/assets/config.json
    status: 200
    note: Exposed the portal REST base URL https://apim-api.apic4e.faa.gov/portal
  - url: https://developer.transportation.gov/
