method: searched
source: npm registry search, PyPI, Maven Central, pkg.go.dev, RubyGems, GitHub org usdot-jpo-ode
summary: >-
  U.S. DOT publishes NO first-party client SDK for any of its public APIs. npm, PyPI,
  RubyGems, Maven Central, NuGet, crates.io, Packagist and pkg.go.dev were all searched
  for "faa", "usdot", "us-dot", "bts" and "socrata" scoped or authored by the department
  and none returned a package published by DOT, FAA or BTS. The department's own GitHub
  presence (github.com/usdot-jpo-ode) ships deployable Java/C++ services and ASN.1/JSON
  Schema specifications, not consumer client libraries. Everything listed below is
  third-party — official: false in every row. No SDKs pointer is emitted for this
  provider because there is no first-party client library to point at.
packages: []
first_party_source_code:
- name: jpo-ode
  org: usdot-jpo-ode
  url: https://github.com/usdot-jpo-ode/jpo-ode
  language: java
  kind: deployable-service
  official: true
  note: USDOT ITS JPO Operational Data Environment. Ships the Swagger 2.0 REST contract harvested to openapi/us-dot-its-jpo-ode-rest-api-openapi.yml. Self-hosted, not a client library.
- name: wzdx
  org: usdot-jpo-ode
  url: https://github.com/usdot-jpo-ode/wzdx
  kind: specification
  official: true
  note: Work Zone Data Exchange specification. JSON Schema 4.2 harvested to json-schema/.
- name: scms-asn1
  org: usdot-jpo-ode
  url: https://github.com/usdot-jpo-ode/scms-asn1
  kind: specification
  official: true
  note: ASN.1 data container definitions for the Security Credential Management System. Not protobuf; no grpc/ artifact applies.
