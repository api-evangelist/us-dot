    install: npm install @shaggytools/nhtsa-api-wrapper
    official: false
    covers: [us-dot:nhtsa-vpic-api]
    note: Universal JavaScript wrapper for the NHTSA vPIC vehicles API. The most complete community client.
  - language: javascript
    registry: npm
    name: nhtsa
    url: https://www.npmjs.com/package/nhtsa
    install: npm install nhtsa
    official: false
    covers: [us-dot:nhtsa-vpic-api]
  - language: javascript
    registry: npm
    name: "@cardog/corgi"
    url: https://www.npmjs.com/package/@cardog/corgi
    install: npm install @cardog/corgi
    official: false
    covers: [us-dot:nhtsa-vpic-api]
    note: Offline VIN decoding built from NHTSA vPIC data.
  - language: javascript
    registry: npm
    name: fmcsa-sdk
    url: https://www.npmjs.com/package/fmcsa-sdk
    install: npm install fmcsa-sdk
    official: false
    covers: [us-dot:fmcsa-qcmobile-api]
  - language: python
