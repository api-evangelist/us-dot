    Tyler Data & Insights publishes SODA client libraries for Java, .NET, PHP, Python, R,
    Ruby, Scala, Swift, Go, Elixir, Julia, PowerShell, Android and iOS. These are platform
    SDKs for Socrata, not U.S. DOT deliverables, and are recorded here for consumer
    convenience only.
round_2_additions:
  generated: '2026-07-28'
  method: searched
  source: >-
    npm registry search (nhtsa, fmcsa, fra, vpic, socrata), PyPI, and the developer sites
    for the surfaces discovered in this round — NHTSA vPIC, NHTSA Safety, FRA Safety Data
    Web Services and FMCSA QCMobile.
  finding: >-
    Unchanged. Not one first-party client library exists for any newly discovered DOT
    surface either. NHTSA ships no SDK for vPIC despite it being the most widely consumed
    API in the department; FMCSA ships no SDK; FRA ships WSDL and expects you to generate
    your own stub. The community has filled the gap around NHTSA specifically, which is
    the clearest demand signal in this whole provider — eight distinct npm packages wrap
    an API its publisher provides no client for.
  third_party:
