summary: >-
  U.S. DOT publishes no sandbox, no test keys, no magic test identifiers and no mock
  environment for any of its APIs — and mostly does not need one. Every read surface in
  this repo answers anonymously against PRODUCTION with real data at no cost and no rate
  charge, so "try it" and "run it" are the same call. Where a sandbox WOULD matter — the
  two credentialed write surfaces, FAA Pilot Records and FAA Safety Assurance System —
  none is reachable. The PRD OpenAPI advertises a staging host that does not resolve for
  the public.
test_vs_live:
  separation: none
  detail: >-
    There is no test/live key prefix, no mode header and no account-level test switch on
    any DOT surface. The FAA gateway issues one credential pair per approved
    application against production.
staging_environments:
