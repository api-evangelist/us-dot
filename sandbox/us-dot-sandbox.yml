safe_identifiers:
  detail: >-
    No provider-published magic/test values exist. The identifiers below are real values
    published in the specs' own enums and are safe to use for a first call; they are not
    "test" data.
  values:
  - surface: FAA ASWS
    parameter: airportCode
    examples: [JFK, KJFK, ORD, ATL, SFO]
    published_in: 'openapi operation description — the ~40 supported airports are enumerated verbatim'
  - surface: FAA APRA
    parameter: edition
    examples: [current, next, changeset]
    published_in: openapi parameter enum
  - surface: FAA APRA
    parameter: geoname
    examples: [US, Alaska, Pacific, Caribbean]
    published_in: openapi parameter enum on getIFREnrouteRelease
  - surface: FAA SAS
    parameter: request body
    examples: [examples/us-dot-faa-sas-submit-discrepancies-request.json]
    published_in: 'openapi requestBody example — FAA''s own synthetic sample ("Al''s Airline"). This is the closest thing to a test fixture the department publishes.'
credential_issuance:
- api: [us-dot:faa-air-carrier-prd-api, us-dot:faa-safety-assurance-system-api]
  portal: https://api.faa.gov/s/
  mechanism: >-
    Register in the FAA Gravitee developer portal, request access to a specific API,
    receive client_id/client_secret (PRD) or X-API-KEY/X-APP-ID (SAS) on approval.
  self_serve: false
  gate: 'PRD is restricted to operators under 14 CFR Part 121, 135, 125, 91K, Air Tour, Public Aircraft or Part 91 Corporate. This is an accreditation gate, not a signup form.'
  guide: https://www.faa.gov/regulationspolicies/pilotrecordsdatabase/air-carrier-api-discover-learn-get-access
- api: us-dot:fmcsa-qcmobile-api
  portal: https://mobile.fmcsa.dot.gov/QCDevsite/
  mechanism: Create a Login.gov account, sign in to the FMCSA developer site, generate a free API key (webKey).
  self_serve: true
  note: The only self-serve API key in the department. Login.gov is the federal identity provider.
- api: us-dot:fra-safety-data-api
  portal: https://safetydata.fra.dot.gov/MasterWebService/FRASafetyDataAPIs.aspx
  mechanism: 'Email RsisSupport@dot.gov to request a web-service account. Two separate requests: "API (Web Service) Account Request" and "Lite API (Web Service) Account Request".'
  self_serve: false
- api: [us-dot:dot-data-hub-soda-api, us-dot:bts-open-data-soda-api]
  portal: https://data.transportation.gov/profile/edit/developer_settings
  mechanism: >-
    Optional Socrata application token (X-App-Token header or $$app_token query
    parameter). Not authentication — it moves the caller off the shared anonymous
    throttle pool onto a per-application one. Calls work fully without it.
  self_serve: true
test_tooling:
- name: ODE test harness
  url: https://github.com/usdot-jpo-ode/jpo-ode/tree/master/qa/test-harness
  covers: us-dot:its-jpo-ode-rest-api
  note: >-
    A test harness shipped with the deployable ODE software, driven by .ini fixtures.
    Applies to an operator running their own ODE, not to a DOT-hosted service.
- name: docker-compose local stack
  url: https://github.com/usdot-jpo-ode/jpo-ode/blob/master/docker-compose.yml
  covers: us-dot:its-jpo-ode-rest-api
  note: The ODE's real "sandbox" is running the whole platform locally against a local Kafka cluster.
absent:
- test card numbers / payment fixtures — not applicable, nothing in the department is monetised
- test clocks or time simulation
- fixture generators or event triggers
- a hosted API console or "try it" widget (the FAA Gravitee portal exposes documentation pages, not an executable console, to anonymous visitors)
