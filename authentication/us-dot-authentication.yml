schemes:
- name: apiKey
  type: apiKey
  in: header
  parameter: X-API-KEY
  applies_to: us-dot:faa-safety-assurance-system-api
  sources:
  - openapi/us-dot-faa-safety-assurance-system-api-openapi.yml
  note: >-
    Declared as a securityScheme but NOT applied — the spec has no top-level or
    operation-level `security` block, so generated clients omit it and get a gateway 401.
- name: appId
  type: apiKey
  in: header
  parameter: X-APP-ID
  applies_to: us-dot:faa-safety-assurance-system-api
  sources:
  - openapi/us-dot-faa-safety-assurance-system-api-openapi.yml
  note: Required alongside X-API-KEY. Same non-application problem.
- name: clientIdHeader
  type: apiKey
  in: header
  parameter: client_id
  applies_to: us-dot:faa-air-carrier-prd-api
  sources:
  - openapi/us-dot-faa-air-carrier-prd-api-openapi.yml
  note: >-
    Declared as a REQUIRED header parameter on every operation, not as a securityScheme.
    Paired with client_secret. An OAuth-shaped credential pair with no OAuth protocol —
    no token endpoint, no expiry, no scopes, no refresh.
- name: clientSecretHeader
  type: apiKey
  in: header
  parameter: client_secret
  applies_to: us-dot:faa-air-carrier-prd-api
  sources:
  - openapi/us-dot-faa-air-carrier-prd-api-openapi.yml
- name: socrataAppToken
  type: apiKey
  in: header
  parameter: X-App-Token
  alternate:
    in: query
    parameter: $$app_token
  applies_to: [us-dot:dot-data-hub-soda-api, us-dot:bts-open-data-soda-api]
  optional: true
  docs: https://dev.socrata.com/docs/app-tokens.html
  note: >-
    NOT authentication. An application token identifies the calling application so
    Socrata can apply a per-application throttle instead of the shared anonymous pool.
    Every read works without it. Issued self-serve at
    https://data.transportation.gov/profile/edit/developer_settings.
- name: fmcsaWebKey
  type: apiKey
  in: query
  parameter: webKey
  applies_to: us-dot:fmcsa-qcmobile-api
  docs: https://mobile.fmcsa.dot.gov/QCDevsite/docs/apiAccess
  note: >-
    Free, self-serve — the only self-serve API credential in the department. Requires a
    Login.gov account to obtain. Login.gov is the federal OIDC identity provider, but it
    gates key ISSUANCE, not the API itself; FMCSA exposes no OIDC discovery document.
- name: fraWebServiceAccount
  type: http
  scheme: unspecified
  applies_to: us-dot:fra-safety-data-api
  docs: https://safetydata.fra.dot.gov/MasterWebService/FRASafetyDataAPIs.aspx
  note: >-
    A "web service account" requested by emailing RsisSupport@dot.gov. Two separate
    request types — one for the full Data Download service, one for the Lite API. Neither
    WSDL declares a WS-Security policy; the credential model is not published.
- name: odeOperatorDefined
  type: none
  applies_to: us-dot:its-jpo-ode-rest-api
  note: >-
    The ODE Swagger 2.0 document declares no securityDefinitions. Authentication is
    whatever the deploying operator puts in front of it. Given this API writes to physical
    roadside units, that absence is the finding.
