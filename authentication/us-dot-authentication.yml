  openapi/us-dot-faa-safety-assurance-system-api-openapi.yml (securitySchemes),
  openapi/us-dot-faa-air-carrier-prd-api-openapi.yml (header parameters),
  https://api.faa.gov/s/, https://mobile.fmcsa.dot.gov/QCDevsite/,
