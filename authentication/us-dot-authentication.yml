summary:
  types:
  - none
  - apiKey
  api_key_in:
  - header
  - query
  oauth2_flows: []
  openid_connect: false
  mutual_tls: false
  detail: >-
    U.S. DOT uses NO OAuth 2.0 and NO OpenID Connect on any API. Every credentialed
    surface is a static key or key-pair sent in request headers. The majority of the
    department's API surface area requires no credential at all. There is no departmental
    identity layer for API consumers — Login.gov appears once, in front of FMCSA key
    issuance, not in front of an API.
  spec_gap: >-
    Only ONE of the five harvested specs declares securitySchemes at all (the FAA SAS
    API). The FAA PRD API sends its credentials as ordinary header PARAMETERS with no
    securityScheme and no security requirement, which is why a mechanical derive over
    securitySchemes alone misses it. Both are recorded below.
