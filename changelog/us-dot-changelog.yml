summary: >-
  U.S. DOT publishes no API changelog. No release notes page, no "what's new" feed, no
  dated version history for any of the FAA, BTS or DOT Data Hub APIs. The only dated,
  structured change history the department itself maintains is on GitHub, for
  SPECIFICATIONS rather than services — the Work Zone Data Exchange releases. Everything
  else below is reconstructed from timestamps the FAA API gateway exposes in its public
  catalog, which is a change signal, not a changelog.
scheme: none
scheme_note: >-
  Versions live in OpenAPI info.version (FAA), in the URL path (Socrata /resource is
  SODA 2.1; CKAN /api/3), or in a GitHub tag (WZDx). No surface negotiates version by
  header or date, and no surface runs more than one version concurrently.
