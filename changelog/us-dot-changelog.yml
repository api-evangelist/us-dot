gaps:
- No dated changelog for the FAA ASWS or APRA services, whose 34 chart products change on a 28/56-day AIRAC cycle.
- No changelog for the DOT Data Hub or BTS Socrata tenancies. Per-dataset `modified` in /data.json is the only signal.
- No RSS or Atom feed for API changes anywhere in the department. The only subscription surface is a human email list at https://www.faa.gov/data/subscribe.
