unmodelled_surfaces:
- surface: DOT Data Hub / BTS Socrata SODA
  reason: >-
    Every dataset is its own flat schema declared per-asset at /api/views/{id}.json.
    There are 1,542 datasets on data.transportation.gov and 420 on data.bts.gov; there is
    no cross-dataset entity model, no foreign keys and no canonical DOT entity registry.
    Field-level types are discoverable per dataset but not unifiable.
- surface: FAA CKAN catalog (catalog.data.faa.gov)
  reason: 'CKAN''s own package/resource/organization/tag model, DCAT-US 1.1 profile. Metadata about datasets, not transportation entities.'
