summary: >-
  U.S. DOT has no departmental data model. Each surface carries its own vocabulary and
  there are no shared identifiers across them — an FAA airport status record, a BTS T-100
  segment row and a WZDx road event feature cannot be joined on any DOT-issued key. The
  one genuine cross-surface join key is the airport code (IATA three-letter and ICAO
  four-letter), which appears in FAA ASWS, FAA SAS discrepancy reports and the BTS
  Socrata aviation datasets. This file records the entity graph that the harvested
  machine-readable artifacts actually declare; nothing is inferred beyond $ref links and
  id-reference field names.
identifiers:
- id: iata_airport_code
  pattern: 3-letter IATA code (e.g. JFK)
  appears_in: [AirportStatus.iata, Delays.*.airport, Discrepancy.AirportCode, Discrepancy.DestinationAirportCode]
  cross_surface: true
  note: The only identifier shared between the FAA services and the BTS/DOT Socrata aviation datasets.
- id: icao_airport_code
  pattern: 4-letter ICAO code (e.g. KJFK)
  appears_in: [AirportStatus.icao]
  cross_surface: false
  note: ASWS accepts either IATA or ICAO on the airportCode path parameter and returns both on the response.
- id: carrier_designator
  pattern: FAA air carrier designator (DSGN), 4 characters
  appears_in: [sasRequest.ReporterDSGN, Discrepancy.AirCarrierDSGN, Discrepancy.FlightOperatedByDSGN]
  cross_surface: false
- id: socrata_four_by_four
  pattern: 'xxxx-xxxx (e.g. bu82-4pwz)'
  appears_in: [DOT Data Hub resource paths, BTS Open Data resource paths]
  cross_surface: false
  note: >-
    The dataset identifier on every SODA resource URL. Not an entity id — it identifies
    the dataset, not a row. Resolvable to metadata at /api/views/{fourbyfour}.json.
- id: edition
  pattern: current | next | changeset
  appears_in: [APRA edition query parameter on 30 of 34 operations]
  cross_surface: false
  note: >-
    APRA has no row-level identifier at all. The addressable unit is (product, edition,
    format, geoname/volume/seriesType) — a coordinate, not a key.
