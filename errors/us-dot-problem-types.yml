source: openapi/*.yml 4xx/5xx responses + live probes of the anonymous FAA and Socrata endpoints
format: none
format_note: >-
  No U.S. DOT or FAA surface uses RFC 9457 application/problem+json. The FAA Gravitee
  gateway returns a flat JSON object {"message": ..., "http_status_code": ...}; the FAA
  ASWS and APRA services return an empty body with the status code and a human-readable
  description declared in the OpenAPI; Socrata SODA returns its own envelope
  {"code": ..., "error": true, "message": ..., "data": {...}}. Three different error
  shapes across one department — recorded honestly rather than normalised.
envelopes:
- surface: FAA API gateway (Gravitee, external-api.faa.gov / external.apic4e.faa.gov)
  media_type: application/json
  shape:
    message: string
    http_status_code: integer
  evidence: 'Live probe 2026-07-28 of https://external-api.faa.gov/notamapi/v1/notams returned {"message":"Unauthorized","http_status_code":401}.'
- surface: FAA ASWS / APRA services
  media_type: none
  shape: empty body
  evidence: 'OpenAPI declares 400/404/500 with `content: {}` on every operation.'
- surface: Socrata SODA 2.1 (data.transportation.gov, datahub.transportation.gov, data.bts.gov)
  media_type: application/json
  shape:
    code: string
    error: boolean
    message: string
    data: object
  evidence: https://dev.socrata.com/docs/errors.html
