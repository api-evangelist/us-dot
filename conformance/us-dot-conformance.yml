compliance_program:
  published: false
  detail: >-
    U.S. DOT publishes no API-facing compliance program page, no trust centre, and no
    third-party certification (no SOC 2, no ISO 27001, no PCI DSS, no FedRAMP
    authorisation held by DOT itself for these public surfaces). As a federal agency its
    obligations are statutory (FISMA, the Privacy Act, Section 508, the Evidence Act)
    rather than certified, and it discloses them through Privacy Impact Assessments and
    System of Records Notices rather than an audit report. No `Compliance` pointer is
    emitted for this provider — the standards above are conformance findings, not a
    published compliance posture, and claiming otherwise would misrepresent it.
