  live probes 2026-07-28
summary: >-
  U.S. DOT conforms to the FEDERAL open-data stack completely and to the modern API
  standards stack barely at all. Project Open Data / DCAT-US 1.1, CKAN Action API v3,
  Socrata SODA 2.1, GeoJSON and JSON Schema are all genuinely implemented and verifiable
  on the wire. OAuth 2.0, OpenID Connect, RFC 9457 problem details, RFC 8594 sunset
  headers, RFC 9116 security.txt, RFC 8615 well-known discovery, AsyncAPI, JSON:API and
  RFC 9111 cache directives are all absent. The department is an exemplary open-data
  publisher and an unremarkable API publisher.
