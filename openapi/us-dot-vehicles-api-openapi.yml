openapi: 3.2.0
info:
  title: NHTSA childSeats Vehicles API
  version: 1.6.0
  description: Child Seat search and list endpoints
servers:
- url: https://mobile.fmcsa.dot.gov/qc/services
tags:
- description: Vehicle search and list endpoints
  name: Vehicles
paths:
  /vehicles:
    get:
      parameters:
      - allowEmptyValue: false
        description: A comma separated list of data to return (crashtestratings, safetyfeatures, recommendedfeatures, complaints, recalls, investigations, manufacturercommunications, none, all), defaults to 'crashtestratings'.
        in: query
        name: data
        required: false
        style: form
        explode: false
        schema:
          type: string
          format: ''
      - allowEmptyValue: false
        description: 'Valid inputs: [minimal], [all] without brackets. Choose which detail level to show. defaults to: [all]'
        in: query
        name: productDetail
        required: false
        style: form
        explode: false
        schema:
          type: string
          format: ''
      - allowEmptyValue: false
        description: The maximum number of records to return
        in: query
        name: max
        required: false
        style: form
        explode: false
        schema:
          type: integer
          format: int32
      - allowEmptyValue: false
        description: The offset of the records listing (for pagination).
        in: query
        name: offset
        required: false
        style: form
        explode: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Paginated list of all vehicles.
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/VehicleBasicWrapped'
                title: ArrayOfVehicles
                type: array
        '400':
          description: Invalid Request
        '500':
          description: Internal Server Error
      tags:
      - Vehicles
      summary: Get vehicles
      x-summary-source: derived
      operationId: getVehicles
      x-operation-id-source: derived
  /vehicles/byArtemisId:
    get:
      parameters:
      - allowEmptyValue: false
        description: The artemisId for a vehicle.
        in: query
        name: artemisId
        required: true
        style: form
        explode: false
        schema:
          type: integer
          format: int64
      - allowEmptyValue: false
        description: A comma separated list of data to return (crashtestratings, safetyfeatures, recommendedfeatures, complaints, recalls, investigations, manufacturercommunications, none, all), defaults to 'all'.
        in: query
        name: data
        required: false
        style: form
        explode: false
        schema:
          type: string
          format: ''
      - allowEmptyValue: false
        description: 'Valid inputs: [minimal], [all] without brackets. Choose which detail level to show. defaults to: [all]'
        in: query
        name: productDetail
        required: false
        style: form
        explode: false
        schema:
          type: string
          format: ''
      responses:
        '200':
          description: Return the vehicle associated with the specified artemisId.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleDetailsWrapped'
        '400':
          description: Invalid Request
        '500':
          description: Internal Server Error
      tags:
      - Vehicles
      summary: Get vehicles by artemis id
      x-summary-source: derived
      operationId: getVehiclesByArtemisId
      x-operation-id-source: derived
  /vehicles/byMultipleArtemisIds:
    get:
      parameters:
      - allowEmptyValue: false
        description: The artemisIds for vehicles. Comma separated if more than one
        in: query
        name: artemisIds
        required: true
        style: form
        explode: false
        schema:
          type: integer
          format: int64
      - allowEmptyValue: false
        description: This should always be none, as we only want to return minimum counts data
        in: query
        name: data
        required: false
        style: form
        explode: false
        schema:
          type: string
          format: ''
      - allowEmptyValue: false
        description: This should always be null, as we want to get the counts
        in: query
        name: productDetail
        required: false
        style: form
        explode: false
        schema:
          type: string
          format: ''
      responses:
        '200':
          description: Return the vehicle associated with the specified artemisId.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleBasicWrapped'
        '400':
          description: Invalid Request
        '500':
          description: Internal Server Error
      tags:
      - Vehicles
      summary: Get vehicles by multiple artemis ids
      x-summary-source: derived
      operationId: getVehiclesByMultipleArtemisIds
      x-operation-id-source: derived
  /vehicles/byClass:
    get:
      parameters:
      - allowEmptyValue: false
        description: The name of the class to search by.
        in: query
        name: vehicleClass
        required: true
        style: form
        explode: false
        schema:
          type: string
          format: ''
      - allowEmptyValue: false
        description: A comma separated list of data to return (crashtestratings, safetyfeatures, recommendedfeatures, complaints, recalls, investigations, manufacturercommunications, none, all), defaults to 'none'.
        in: query
        name: data
        required: false
        style: form
        explode: false
        schema:
          type: string
          format: ''
      - allowEmptyValue: false
        description: 'Valid inputs: [minimal], [all] without brackets. Choose which detail level to show. defaults to: [minimal]'
        in: query
        name: productDetail
        required: false
        style: form
        explode: false
        schema:
          type: string
          format: ''
      - allowEmptyValue: false
        description: The maximum number of records to return.
        in: query
        name: max
        required: false
        style: form
        explode: false
        schema:
          type: integer
          format: int32
      - allowEmptyValue: false
        description: The offset of the records listing (for pagination).
        in: query
        name: offset
        required: false
        style: form
        explode: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: One or more vehicles that match the specified class.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleBasicWrapped'
        '400':
          description: Invalid Request
        '500':
          description: Internal Server Error
      tags:
      - Vehicles
      summary: Get vehicles by class
      x-summary-source: derived
      operationId: getVehiclesByClass
      x-operation-id-source: derived
  /vehicles/byIds:
    get:
      parameters:
      - allowEmptyValue: false
        description: A CSV list of IDs
        in: query
        name: ids
        required: true
        style: form
        explode: false
        schema:
          type: string
          format: ''
      - allowEmptyValue: false
        description: A comma separated list of data to return (crashtestratings, safetyfeatures, recommendedfeatures, complaints, recalls, investigations, manufacturercommunications, none, all), defaults to 'crashtestratings'.
        in: query
        name: data
        required: false
        style: form
        explode: false
        schema:
          type: string
          format: ''
      - allowEmptyValue: false
        description: 'Valid inputs: [minimal], [all] without brackets. Choose which detail level to show. defaults to: [all]'
        in: query
        name: productDetail
        required: false
        style: form
        explode: false
        schema:
          type: string
          format: ''
      - allowEmptyValue: false
        description: The maximum number of records to return
        in: query
        name: max
        required: false
        style: form
        explode: false
        schema:
          type: integer
          format: int32
      - allowEmptyValue: false
        description: The offset of the records listing (for pagination).
        in: query
        name: offset
        required: false
        style: form
        explode: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Paginated list of vehicles matching the specified list of CSV ids.
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/VehicleDetailsWrapped'
                title: ArrayOfVehicles
                type: array
        '400':
          description: Invalid Request
        '500':
          description: Internal Server Error
      tags:
      - Vehicles
      summary: Get vehicles by ids
      x-summary-source: derived
      operationId: getVehiclesByIds
      x-operation-id-source: derived
  /vehicles/byManufacturer:
    get:
      parameters:
      - allowEmptyValue: false
        description: The name of the manufacturer to search by.
        in: query
        name: manufacturerName
        required: true
        style: form
        explode: false
        schema:
          type: string
          format: ''
      - allowEmptyValue: false
        description: The maximum number of records to return
        in: query
        name: max
        required: false
        style: form
        explode: false
        schema:
          type: integer
          format: int32
      - allowEmptyValue: false
        description: The offset of the records listing (for pagination).
        in: query
        name: offset
        required: false
        style: form
        explode: false
        schema:
          type: integer
          format: int32
      - allowEmptyValue: false
        description: 'The model year to restrict the manufacturer search to. Format: yyyy-MM-dd'
        in: query
        name: dateStart
        required: false
        style: form
        explode: false
        schema:
          type: integer
          format: ''
      - allowEmptyValue: false
        description: 'The model year to restrict the manufacturer search to. Format: yyyy-MM-dd'
        in: query
        name: dateEnd
        required: false
        style: form
        explode: false
        schema:
          type: integer
          format: ''
      - allowEmptyValue: false
        description: A comma separated list of data to return (crashtestratings, safetyfeatures, recommendedfeatures, complaints, recalls, investigations, manufacturercommunications, none, all), defaults to 'none'.
        in: query
        name: data
        required: false
        style: form
        explode: false
        schema:
          type: string
          format: ''
      - allowEmptyValue: false
        description: 'Valid inputs: [minimal], [all] without brackets. Choose which detail level to show. defaults to: [all]'
        in: query
        name: productDetail
        required: false
        style: form
        explode: false
        schema:
          type: string
          format: ''
      - allowEmptyValue: false
        description: 'The column to sort records by. Valid inputs: [''overallRating'', ''overallFrontCrashRating'', ''overallSideCrashRating'', ''rolloverRating'', ''recallsCount'', ''investigationsCount'', ''complaintsCount'', ''manufacturerCommunicationsCount'']'
        in: query
        name: sort
        required: false
        style: form
        explode: false
        schema:
          type: string
          format: ''
      - allowEmptyValue: false
        description: 'Which direction the ''sort'' parameter is applied, valid inputs: [asc, desc]'
        in: query
        name: order
        required: false
        style: form
        explode: false
        schema:
          type: string
          format: ''
      - allowEmptyValue: false
        description: 'Filter the response by the specified field. Valid inputs: [vehicleClass]'
        in: query
        name: filter
        required: false
        style: form
        explode: false
        schema:
          type: string
          format: ''
      - allowEmptyValue: false
        description: 'The value to use as a filter. Valid inputs: [SUV, TRUCK, PASSENGERCAR, VAN, BUS]'
        in: query
        name: filterValue
        required: false
        style: form
        explode: false
        schema:
          type: string
          format: ''
      responses:
        '200':
          description: One or more vehicles that match the specified manufacturer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleBasicWrapped'
        '400':
          description: Invalid Request
        '500':
          description: Internal Server Error
      tags:
      - Vehicles
      summary: Get vehicles by manufacturer
      x-summary-source: derived
      operationId: getVehiclesByManufacturer
      x-operation-id-source: derived
  /vehicles/byNcapId:
    get:
