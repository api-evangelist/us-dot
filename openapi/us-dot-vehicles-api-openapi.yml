        required: false
        style: form
        explode: false
        schema:
          type: string
          format: ''
      - allowEmptyValue: false
        description: 'The maximum number of records to return, upper bound: 50.'
        in: query
        name: max
        required: false
        style: form
        explode: false
        schema:
          type: integer
          format: int32
      - allowEmptyValue: false
        description: The offset of the records listing (for pagination).
        in: query
        name: offset
        required: false
        style: form
        explode: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Paginated list of vehicles whose make, model, year, or trim match the supplied search query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleBasicWrapped'
        '400':
          description: Invalid Request
        '500':
