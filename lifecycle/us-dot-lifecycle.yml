versioning:
  scheme: mixed
  detail: >-
    There is no departmental API versioning policy. Each surface versions independently:
    FAA APRA and ASWS carry a semantic info.version in the OpenAPI with no version segment
    in the path; the PRD Air Carrier API uses info.version "v1" with no path segment;
    Socrata SODA is versioned in the path (/resource/ is SODA 2.1, /api/v3/ is SODA 3);
    the CKAN Action API is versioned in the path (/api/3/action/); the WZDx specification
    uses semantic major.minor releases on GitHub.
  current:
  - api: us-dot:faa-airport-status-web-service
    version: 1.2.1
    source: openapi info.version
  - api: us-dot:faa-aeronautic-product-release-api
    version: 1.4.0
    source: openapi info.version
  - api: us-dot:faa-air-carrier-prd-api
    version: v1
    source: openapi info.version
  - api: us-dot:faa-safety-assurance-system-api
    version: 1.0.0
    source: openapi info.version
  - api: us-dot:dot-data-hub-soda-api
    version: SODA 2.1
    source: https://dev.socrata.com/docs/endpoints.html
  - api: us-dot:bts-open-data-soda-api
    version: SODA 2.1
    source: https://dev.socrata.com/docs/endpoints.html
  - api: us-dot:faa-data-catalog-ckan-api
    version: CKAN Action API v3 (ckan_version 2.11.4)
    source: 'https://catalog.data.faa.gov/api/3/action/status_show, probed 2026-07-28'
  - api: us-dot:its-jpo-ode-rest-api
    version: 0.0.1
