        talk SNMP to field hardware. Neither the spec nor the docs define an idempotency
        key, and tim_query and snmp_get declare a 408 Timeout with no safe-retry
        contract — a timed-out write may or may not have landed.
      x-apievangelist-event-surface: >-
        The REST API is the thin edge of a Kafka platform. 35 topics are declared in the
        ODE's own configuration; see asyncapi/us-dot-its-jpo-ode-asyncapi.yml.
